name: Release Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            builder_args: --linux AppImage deb rpm --x64
            artifact_glob: "*.{AppImage,deb,rpm}"
          - name: linux-arm64
            os: ubuntu-22.04-arm
            builder_args: --linux AppImage deb rpm --arm64
            artifact_glob: "*.{AppImage,deb,rpm}"
          - name: windows-x64
            os: windows-latest
            builder_args: --win nsis portable --x64
            artifact_glob: "*.exe"
          - name: windows-arm64
            os: windows-11-arm
            builder_args: --win nsis portable --arm64
            artifact_glob: "*.exe"
          - name: macos-x64
            os: macos-15-intel
            builder_args: --mac dmg zip --x64
            artifact_glob: "*.{dmg,zip}"
          - name: macos-arm64
            os: macos-15
            builder_args: --mac dmg zip --arm64
            artifact_glob: "*.{dmg,zip}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short=12 HEAD)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${TAG}" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev.${COMMIT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Build with electron-builder
        shell: bash
        env:
          LOLIA_GIT_COMMIT: ${{ steps.version.outputs.commit }}
          LOLIA_GIT_BRANCH: ${{ github.ref_name }}
          LOLIA_BUILD_TIME: ${{ steps.version.outputs.version }}
        run: |
          npx electron-builder \
            --config.extraMetadata.version="${{ steps.version.outputs.version }}" \
            ${{ matrix.builder_args }} \
            --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: artifacts/**/*
